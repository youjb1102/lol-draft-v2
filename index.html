<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL 밴픽 시뮬레이터</title>
    <style>
        body { background-color: #091428; color: #f0e6d2; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #c8aa6e; }
        .container { display: flex; justify-content: space-around; margin-top: 30px; }
        .team { width: 40%; background: #0a1428; border: 2px solid #c8aa6e; padding: 20px; border-radius: 10px; }
        .blue { border-color: #0bc6e3; }
        .red { border-color: #e84057; }
        .slot { background: #1e2328; margin: 10px 0; padding: 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>LoL Draft Simulator</h1>
    <p>밴픽 시뮬레이터 작동 중입니다!</p>

    <div class="container">
        <div class="team blue">
            <h2>BLUE TEAM</h2>
            <div class="slot">Top: 픽 대기 중</div>
            <div class="slot">Jungle: 픽 대기 중</div>
            <div class="slot">Mid: 픽 대기 중</div>
            <div class="slot">ADC: 픽 대기 중</div>
            <div class="slot">Support: 픽 대기 중</div>
        </div>
        <div class="team red">
            <h2>RED TEAM</h2>
            <div class="slot">Top: 픽 대기 중</div>
            <div class="slot">Jungle: 픽 대기 중</div>
            <div class="slot">Mid: 픽 대기 중</div>
            <div class="slot">ADC: 픽 대기 중</div>
            <div class="slot">Support: 픽 대기 중</div>
        </div>
    </div>
</body>
</html>
