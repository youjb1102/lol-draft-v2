<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Draft Simulator</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background: #080a14; color: #e0e6f8; text-align: center; margin: 0; padding: 40px 20px; }
        
        .main-title { font-size: 32px; font-weight: 800; color: #ffffff; letter-spacing: 1px; text-shadow: 0 0 12px rgba(168, 85, 247, 0.4); margin-bottom: 25px; }
        .lobby-container { max-width: 850px; margin: 0 auto; background: rgba(15, 18, 37, 0.7); border: 1px solid rgba(168, 85, 247, 0.2); padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        
        .section-title { font-size: 14px; color: #a3a8c3; font-weight: 600; margin-bottom: 12px; }
        .mode-group { margin-bottom: 30px; }
        .btn-group { display: flex; justify-content: center; gap: 12px; }
        
        /* 모드 선택 버튼 */
        .mode-btn { background: #13172e; border: 1px solid rgba(255,255,255,0.08); color: #8e95b7; padding: 12px 30px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 30px; transition: all 0.2s; }
        .mode-btn:hover { background: #1c2242; color: #fff; }
        .mode-btn.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border-color: transparent; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
        
        /* 팀 선택 버튼 */
        .team-btn-blue { background: #0e1a38; border: 1px solid #1d4ed8; color: #60a5fa; padding: 14px 40px; font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 12px; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .team-btn-blue.active { background: #1d4ed8; color: #fff; box-shadow: 0 0 15px rgba(29, 78, 216, 0.5); }
        
        .team-btn-red { background: #380e18; border: 1px solid #b91c1c; color: #f87171; padding: 14px 40px; font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 12px; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .team-btn-red.active { background: #b91c1c; color: #fff; box-shadow: 0 0 15px rgba(185, 28, 28, 0.5); }

        #fearless-section { display: none; }

        /* 팀 입력 패널 */
        .teams-wrapper { display: flex; justify-content: space-between; margin-top: 20px; gap: 20px; }
        .team-box { width: 48%; padding: 20px; border-radius: 16px; border: 1px solid transparent; background: #0b0e1b; }
        .team-box.blue { border-color: rgba(29, 78, 216, 0.4); box-shadow: inset 0 0 20px rgba(29, 78, 216, 0.05); }
        .team-box.red { border-color: rgba(185, 28, 28, 0.4); box-shadow: inset 0 0 20px rgba(185, 28, 28, 0.05); }
        
        .team-box h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; font-weight: 700; }
        .team-box.blue h3 { color: #60a5fa; }
        .team-box.red h3 { color: #f87171; }
        
        .input-row { display: flex; align-items: center; background: #13172b; border-radius: 8px; padding: 4px 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .pos-label { width: 60px; font-size: 13px; color: #8e95b7; font-weight: 600; text-align: left; }
        .nickname-input { flex: 1; background: transparent; border: none; padding: 10px; color: #fff; font-size: 14px; outline: none; }
        .nickname-input::placeholder { color: #4b527e; }
        .nickname-input:disabled { cursor: not-allowed; opacity: 0.3; }

        .start-btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border: none; padding: 16px 50px; font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 30px; width: 100%; max-width: 350px; box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4); transition: all 0.2s; }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6); }

        /* 밴픽 화면 */
        #draft-screen { display: none; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 20px auto; }
        .back-btn { background: #13172e; border: 1px solid rgba(255,255,255,0.1); color: #a3a8c3; padding: 8px 18px; cursor: pointer; border-radius: 8px; font-weight: 600; }
        .container { display: flex; justify-content: space-around; margin-top: 20px; }
        .team-draft { width: 45%; background: #0d1021; border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; }
        .slot { background: #13172b; margin: 10px 0; padding: 15px; border-radius: 8px; font-weight: 600; color: #8e95b7; }
    </style>
</head>
<body>

    <div id="lobby-screen" class="lobby-container">
        <div class="main-title">⚔️ LoL Draft Simulator ⚔️</div>

        <div class="mode-group">
            <div class="section-title">경기 종류</div>
            <div class="btn-group">
                <button class="mode-btn active" onclick="selectGameMode('rank5', this)">5인 랭크</button>
                <button class="mode-btn" onclick="selectGameMode('custom', this)">내전</button>
                <button class="mode-btn" onclick="selectGameMode('clash', this)">격전</button>
            </div>
        </div>

        <div id="fearless-section" class="mode-group">
            <div class="section-title">피어리스 옵션</div>
            <div class="btn-group">
                <button class="mode-btn active" onclick="selectFearless(this)">일반</button>
                <button class="mode-btn" onclick="selectFearless(this)">피어리스</button>
                <button class="mode-btn" onclick="selectFearless(this)">하드 피어리스</button>
            </div>
        </div>

        <div class="mode-group">
            <div class="section-title">팀 선택</div>
            <div class="btn-group">
                <button class="team-btn-blue active" onclick="selectMyTeam('blue', this)">🛡️ 블루팀</button>
                <button class="team-btn-red" onclick="selectMyTeam('red', this)">⚔️ 레드팀</button>
            </div>
        </div>

        <div class="section-title">팀 및 닉네임 입력</div>
        <div class="teams-wrapper">
            <div class="team-box blue">
                <h3>블루팀</h3>
                <div class="input-row"><span class="pos-label">🛡️ 탑</span><input type="text" class="nickname-input blue-input" placeholder="닉네임#TAG"></div>
                <div class="input-row"><span class="pos-label">⚔️ 정글</span><input type="text" class="nickname-input blue-input" placeholder="닉네임#TAG"></div>
                <div class="input-row"><span class="pos-label">⚡ 미드</span><input type="text" class="nickname-input blue-input" placeholder="닉네임#TAG"></div>
                <div class="input-row"><span class="pos-label">🏹 원딜</span><input type="text" class="nickname-input blue-input" placeholder="닉네임#TAG"></div>
                <div class="input-row"><span class="pos-label">✚ 서폿</span><input type="text" class="nickname-input blue-input" placeholder="닉네임#TAG"></div>
            </div>
            
            <div class="team-box red">
                <h3>레드팀</h3>
                <div class="input-row"><span class="pos-label">🛡️ 탑</span><input type="text" class="nickname-input red-input" placeholder="닉네임#TAG"></div>
                <div class="input-row"><span class="pos-label">⚔️ 정글</span><input type="text" class="nickname-input red-input" placeholder="닉네임#TAG"></div>
                <div class="input-row"><span class="pos-label">⚡ 미드</span><input type="text" class="nickname-input red-input" placeholder="닉네임#TAG"></div>
                <div class="input-row"><span class="pos-label">🏹 원딜</span><input type="text" class="nickname-input red-input" placeholder="닉네임#TAG"></div>
                <div class="input-row"><span class="pos-label">✚ 서폿</span><input type="text" class="nickname-input red-input" placeholder="닉네임#TAG"></div>
            </div>
        </div>

        <button class="start-btn" onclick="startDraft()">⚔️ 밴픽 시작</button>
    </div>

    <div id="draft-screen">
        <div class="nav-header">
            <button class="back-btn" onclick="goBackToLobby()">⚙️ 설정으로 돌아가기</button>
            <h1 style="margin: 0; font-size: 24px;">LoL Draft Simulator</h1>
            <div style="width: 120px;"></div>
        </div>

        <div class="container">
            <div class="team-draft" style="border-color: #1d4ed8;">
                <h2 style="color: #60a5fa;">BLUE TEAM</h2>
                <div class="slot">Top: 픽 대기 중</div>
                <div class="slot">Jungle: 픽 대기 중</div>
                <div class="slot">Mid: 픽 대기 중</div>
                <div class="slot">ADC: 픽 대기 중</div>
                <div class="slot">Support: 픽 대기 중</div>
            </div>
            <div class="team-draft" style="border-color: #b91c1c;">
                <h2 style="color: #f87171;">RED TEAM</h2>
                <div class="slot">Top: 픽 대기 중</div>
                <div class="slot">Jungle: 픽 대기 중</div>
                <div class="slot">Mid: 픽 대기 중</div>
                <div class="slot">ADC: 픽 대기 중</div>
                <div class="slot">Support: 픽 대기 중</div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'rank5';
        let myTeam = 'blue';

        function selectGameMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-group .mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const fearlessSec = document.getElementById('fearless-section');
            fearlessSec.style.display = (mode === 'custom') ? 'block' : 'none';

            updateInputStates();
        }

        function selectFearless(btn) {
            document.querySelectorAll('#fearless-section .mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function selectMyTeam(team, btn) {
            myTeam = team;
            document.querySelectorAll('.team-btn-blue, .team-btn-red').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            updateInputStates();
        }

        function updateInputStates() {
            const blueInputs = document.querySelectorAll('.blue-input');
            const redInputs = document.querySelectorAll('.red-input');

            // 내전과 격전 모드에서는 상대방 팀 입력창을 열어두고(원하면 입력 가능), 5인 랭크에서만 상대 팀을 완전히 비활성화합니다.
            if (currentMode === 'custom' || currentMode === 'clash') {
                blueInputs.forEach(i => i.disabled = false);
                redInputs.forEach(i => i.disabled = false);
            } else { // 5인 랭크
                if (myTeam === 'blue') {
                    blueInputs.forEach(i => i.disabled = false);
                    redInputs.forEach(i => { i.disabled = true; i.value = ''; });
                } else {
                    redInputs.forEach(i => i.disabled = false);
                    blueInputs.forEach(i => { i.disabled = true; i.value = ''; });
                }
            }
        }

        function startDraft() {
            const blueInputs = Array.from(document.querySelectorAll('.blue-input'));
            const redInputs = Array.from(document.querySelectorAll('.red-input'));

            const isBlueFull = blueInputs.every(i => i.value.trim() !== '');
            const isRedFull = redInputs.every(i => i.value.trim() !== '');

            // 5인 랭크 및 격전: 상대 팀 입력 여부와 상관없이 '내 팀' 5명만 채워지면 출발!
            if (currentMode === 'rank5' || currentMode === 'clash') {
                if (myTeam === 'blue' && !isBlueFull) {
                    alert('우리 팀(블루팀) 5명의 닉네임을 모두 입력해 주세요!');
                    return;
                } else if (myTeam === 'red' && !isRedFull) {
                    alert('우리 팀(레드팀) 5명의 닉네임을 모두 입력해 주세요!');
                    return;
                }
            } else if (currentMode === 'custom') { // 내전: 10명 필수 입력
                if (!isBlueFull || !isRedFull) {
                    alert('내전 모드는 양 팀 10명의 닉네임을 모두 입력해야 합니다!');
                    return;
                }
            }

            history.pushState({ page: 'draft' }, 'Draft', '#draft');
            showDraftScreen();
        }

        function showDraftScreen() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('draft-screen').style.display = 'block';
        }

        function goBackToLobby() {
            document.getElementById('draft-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';
        }

        window.onpopstate = function() { goBackToLobby(); };
        window.onload = function() { updateInputStates(); };
    </script>
</body>
</html>
